<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar Empleado</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa; 
        }
        .container {
            margin-top: 50px;
            background-color: #d4edda; 
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
        }
        .btn {
            width: 48%;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-secondary {
            background-color: #6c757d; 
            border-color: #6c757d;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .button-group {
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>
    <br>
    <br>
    <div class="container">
        <h1>Actualizar Empleado</h1>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input autocomplete="off" type="text" class="form-control" name="nombre" id="nombre" value="{{ empleado.nombre }}" required>
            </div>
            <div class="form-group">
                <label for="puesto">Puesto:</label>
                <input autocomplete="off" type="text" class="form-control" name="puesto" id="puesto" value="{{ empleado.puesto }}" required>
            </div>
            <div class="form-group">
                <label for="salario">Salario:</label>
                <input autocomplete="off" type="text" class="form-control" name="salario" id="salario" value="{{ empleado.salario }}" required>
            </div>
            <div class="button-group mt-3">
                <button type="submit" class="btn btn-primary">Actualizar</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary">Volver a la lista</a>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.0.7/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
